name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os-name }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            os-name: "Windows 10 (Server 2022)"
            python-version: "3.10"
          - os: windows-2022
            os-name: "Windows 10 (Server 2022)"
            python-version: "3.11"
          - os: windows-2022
            os-name: "Windows 10 (Server 2022)"
            python-version: "3.12"
          - os: windows-2025
            os-name: "Windows 11 (Server 2025)"
            python-version: "3.10"
          - os: windows-2025
            os-name: "Windows 11 (Server 2025)"
            python-version: "3.11"
          - os: windows-2025
            os-name: "Windows 11 (Server 2025)"
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run automated test suite (100 tests)
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest -v
