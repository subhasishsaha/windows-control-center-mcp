[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-control-center-mcp"
version = "1.0.1"
description = "A local Windows Control Center Model Context Protocol (MCP) server for Antigravity, Claude Desktop, Cursor, and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "windows",
    "fastmcp",
    "ai-agent",
    "powershell",
    "security",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=4.1.0",
    "psutil>=7.0.0",
    "pyperclip>=1.8.0",
    "pillow>=10.0.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/subhasishsaha/windows-control-center-mcp"
Repository = "https://github.com/subhasishsaha/windows-control-center-mcp"
Issues = "https://github.com/subhasishsaha/windows-control-center-mcp/issues"
Documentation = "https://github.com/subhasishsaha/windows-control-center-mcp/blob/main/DOCUMENTATION.md"

[project.scripts]
windows-control-center-mcp = "server:main"

[tool.setuptools.package-dir]
"" = "src/windows-control-center-mcp"

[tool.setuptools]
py-modules = ["server", "security", "sandbox"]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src/windows-control-center-mcp"]
